# Mixed Signals with DIMACS text encoding.
# Requires the dimacs clean baseline first:
#   results/baseline/text_and_image/<task>/spring_dimacs_Qwen2.5-VL-7B-Instruct.jsonl

data_dir: data

tasks:
  - node_count
  - cycle_check

model: qwen-7b

modalities:
  - text_and_image

text_encoding: "dimacs"

image_types:
  - spring

batch_size: 1

output_dir: results/mixed_baseline/

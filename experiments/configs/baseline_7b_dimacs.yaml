# Experiment 1 (clean baseline) with DIMACS text encoding.
# All 7 GraphQA tasks. Exp1 skips a task whose result JSONL already exists.
#
# Outputs:
#   results/baseline/text_and_image/<task>/spring_dimacs_Qwen2.5-VL-7B-Instruct.jsonl

data_dir: data

tasks:
  - node_degree
  - node_count
  - edge_existence
  - edge_count
  - disconnected_nodes
  - triangle_counting
  - cycle_check

model: qwen-7b

modalities:
  - text_and_image

text_encoding: "dimacs"

image_types:
  - spring

batch_size: 1

output_dir: results/baseline/

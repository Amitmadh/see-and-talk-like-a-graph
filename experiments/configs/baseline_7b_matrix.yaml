# baseline_7b_matrix.yaml
#
# Experiment 1 (clean baseline) with the MATRIX text encoding.
# This MUST run before the matrix Mixed Signals experiment, because
# experiment_02 keeps only samples the model answered correctly in the
# clean text+image baseline — and that baseline currently only exists
# for the edge-list encoding.
#
# Outputs (note text_encoding is now in the filename, so these sit
# NEXT TO the adjacency baseline instead of overwriting it):
#   results/baseline/text_and_image/<task>/spring_adjacency_matrix_Qwen2.5-VL-7B-Instruct.jsonl

data_dir: data

tasks:
  - node_degree
  - node_count
  - edge_existence
  - edge_count
  - disconnected_nodes
  - triangle_counting
  - cycle_check

model: qwen-7b

modalities:
  - text_and_image

text_encoding: "adjacency_matrix"

image_types:
  - spring

batch_size: 1

output_dir: results/baseline/

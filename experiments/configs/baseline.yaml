# baseline.yaml

data_dir: data

tasks:
  - connected_nodes
  - shortest_path
  - cycle_check
  - node_degree
  - node_count
  - edge_existence

model: qwen-3b
   #Qwen2.5-VL


modalities:
  text_only: true
  image_only: true
  text_and_image: true

text_encoding: "adjacency"

image_types:
  - spring

batch_size: 8

output_dir: results/baseline/
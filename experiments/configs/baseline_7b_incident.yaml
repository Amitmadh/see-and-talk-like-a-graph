# Experiment 1 (clean baseline) with the count-oriented incident encoding.
# Two tasks only: node_count (the tilt) and cycle_check (the image-heavy control).
#
# Outputs:
#   results/baseline/text_and_image/<task>/spring_incident_Qwen2.5-VL-7B-Instruct.jsonl

data_dir: data

tasks:
  - node_count
  - cycle_check

model: qwen-7b

modalities:
  - text_and_image

text_encoding: "incident"

image_types:
  - spring

batch_size: 1

output_dir: results/baseline/
